# WebTaskKit temporary HTTP configuration used for first deploy and ACME.
server {
    listen 80;
    server_name webtaskkit.com www.webtaskkit.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    resolver 127.0.0.11 valid=30s ipv6=off;
    set $webtaskkit_upstream http://webtaskkit_app:3000;

    location / {
        proxy_pass $webtaskkit_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_buffering off;
        client_max_body_size 1m;
    }

    access_log /var/log/nginx/webtaskkit.com.access.log;
    error_log /var/log/nginx/webtaskkit.com.error.log warn;
}

