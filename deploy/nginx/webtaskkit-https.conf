# WebTaskKit canonical HTTPS configuration.
server {
    listen 80;
    server_name webtaskkit.com www.webtaskkit.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://webtaskkit.com$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name www.webtaskkit.com;

    ssl_certificate /etc/letsencrypt/live/webtaskkit.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/webtaskkit.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://webtaskkit.com$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name webtaskkit.com;

    ssl_certificate /etc/letsencrypt/live/webtaskkit.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/webtaskkit.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:WebTaskKitSSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    resolver 127.0.0.11 valid=30s ipv6=off;
    set $webtaskkit_upstream http://webtaskkit_app:3000;

    location / {
        proxy_pass $webtaskkit_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_buffering off;
        client_max_body_size 1m;
    }

    access_log /var/log/nginx/webtaskkit.com.access.log;
    error_log /var/log/nginx/webtaskkit.com.error.log warn;
}

