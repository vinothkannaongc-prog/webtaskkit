# Privacy-minimized request and interaction logs. These formats deliberately
# omit client IPs, query strings, referrers, cookies and user agents.
log_format webtaskkit_privacy_access escape=json
    '{"timestamp":"$time_iso8601","site":"webtaskkit.com","method":"$webtaskkit_access_method",'
    '"path":"$webtaskkit_access_path","status":$status,"bytes":$body_bytes_sent,'
    '"request_seconds":$request_time,"upstream_seconds":"$upstream_response_time"}';

log_format webtaskkit_privacy_event escape=json
    '{"timestamp":"$time_iso8601","site":"webtaskkit.com",'
    '"event":"$webtaskkit_event_name","path":"$webtaskkit_event_path"}';

map $uri $webtaskkit_access_path {
    default /_other;
    / /;
    /about /about;
    /privacy /privacy;
    /generators /generators;
    /generators/qr-code /generators/qr-code;
    /generators/barcode /generators/barcode;
    /generators/tone /generators/tone;
    /converters /converters;
    /converters/txt-to-pdf /converters/txt-to-pdf;
    /converters/image-to-pdf /converters/image-to-pdf;
    /converters/pdf-to-jpg /converters/pdf-to-jpg;
    /editors /editors;
    /editors/svg /editors/svg;
    /editors/text /editors/text;
    /robots.txt /robots.txt;
    /sitemap.xml /sitemap.xml;
}

map $request_method $webtaskkit_access_method {
    default OTHER;
    GET GET;
    HEAD HEAD;
    POST POST;
    OPTIONS OPTIONS;
}

map $upstream_http_x_event_name $webtaskkit_event_name {
    default "";
    tool_started tool_started;
    tool_completed tool_completed;
    output_action output_action;
    validation_error validation_error;
}

map $upstream_http_x_event_path $webtaskkit_event_path {
    default "";
    /generators/qr-code /generators/qr-code;
    /generators/barcode /generators/barcode;
    /generators/tone /generators/tone;
    /converters/txt-to-pdf /converters/txt-to-pdf;
    /converters/image-to-pdf /converters/image-to-pdf;
    /converters/pdf-to-jpg /converters/pdf-to-jpg;
    /editors/svg /editors/svg;
    /editors/text /editors/text;
}

map "$status|$webtaskkit_event_name|$webtaskkit_event_path" $webtaskkit_event_loggable {
    default 0;
    ~^204\|(tool_started|tool_completed|output_action|validation_error)\|/(generators/(qr-code|barcode|tone)|converters/(txt-to-pdf|image-to-pdf|pdf-to-jpg)|editors/(svg|text))$ 1;
}

# A client address is used only as an ephemeral in-memory abuse-prevention key;
# it is never persisted. The site-wide zone is a coarse flood circuit breaker.
limit_req_zone $binary_remote_addr zone=webtaskkit_events_client:1m rate=2r/s;
limit_req_zone $server_name zone=webtaskkit_events_global:1m rate=50r/s;

# WebTaskKit canonical HTTPS configuration.
server {
    listen 80;
    server_name webtaskkit.com www.webtaskkit.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://webtaskkit.com$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name www.webtaskkit.com;

    ssl_certificate /etc/letsencrypt/live/webtaskkit.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/webtaskkit.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://webtaskkit.com$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name webtaskkit.com;

    ssl_certificate /etc/letsencrypt/live/webtaskkit.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/webtaskkit.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:WebTaskKitSSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    resolver 127.0.0.11 valid=30s ipv6=off;
    set $webtaskkit_upstream http://webtaskkit_app:3000;

    location = /__events {
        limit_except POST { deny all; }
        limit_req zone=webtaskkit_events_client burst=20 nodelay;
        limit_req zone=webtaskkit_events_global burst=200 nodelay;
        limit_req_status 429;
        limit_req_log_level error;
        client_max_body_size 128;
        proxy_request_buffering on;

        proxy_pass_request_headers off;
        proxy_set_header Host webtaskkit.com;
        proxy_set_header Origin $http_origin;
        proxy_set_header Content-Type $http_content_type;
        proxy_set_header Content-Length $content_length;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";

        proxy_hide_header X-Event-Name;
        proxy_hide_header X-Event-Path;
        proxy_http_version 1.1;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        proxy_send_timeout 5s;
        proxy_pass $webtaskkit_upstream/__events;

        access_log /var/www/html/docker/nginx/event-logs/webtaskkit/events.jsonl webtaskkit_privacy_event if=$webtaskkit_event_loggable buffer=16k flush=5s;
        error_log /dev/null crit;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    }

    location / {
        proxy_pass $webtaskkit_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_buffering off;
        client_max_body_size 1m;
    }

    access_log /var/www/html/docker/nginx/event-logs/webtaskkit/access.jsonl webtaskkit_privacy_access;
    error_log /dev/null crit;
}
